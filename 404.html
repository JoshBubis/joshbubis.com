<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:

    main {
      width: min(100%, 24rem);

    }
    .mark {
      display: inline-flex;
      align-items: baseline;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      margin-bottom: 1.75rem;
      color: #eef1f5;

    .mark__j {
      display: inline-block;
      min-width: 1.15em;
      padding: 0.1em 0.15em;

      color: #07080c;
      text-align: center;
      border-radius: 2px;
    }
    .code {
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #e23a3a;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: clamp(1.5rem, 4vw, 1.85rem);

      letter-spacing: -0.03em;
      line-height: 1.2;

    p {
      color: #8b95a3;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      padding: 0.7rem 1.2rem;
      background: #eef1f5;
      color: #07080c;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      border-radius: 2px;
    }
    .btn:hover { background: #e23a3a; color: #fff; }

</head>

  <main>
